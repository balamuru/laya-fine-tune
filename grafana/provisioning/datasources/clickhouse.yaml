apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    access: proxy
    url: http://clickhouse:8123
    user: default
    secureJsonData:
      password: "${CLICKHOUSE_PASSWORD}"
    jsonData:
      host: "clickhouse"
      port: 8123
      protocol: "http"
      defaultDatabase: "bluesky"
      username: "default"
    isDefault: true
